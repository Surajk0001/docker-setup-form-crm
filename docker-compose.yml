services:
  mariadb:
    image: mariadb:10.8
    # ... (aapka baaki config same rahega)
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - internal_net
    restart: unless-stopped

  redis:
    image: redis:alpine
    networks:
      - internal_net
    restart: unless-stopped

  frappe:
    image: frappe/crm:stable  # <-- Yahan official image use karo
    # command: bash /workspace/init.sh  <-- Yeh line hata do
    working_dir: /home/frappe/frappe-bench
    environment:
      - SHELL=/bin/bash
      - SITE_NAME=crm.growthkulagency.com
      - DB_HOST=mariadb
      - DB_PORT=3306
      - REDIS_CACHE=redis://redis:6379
      - REDIS_QUEUE=redis://redis:6379
    volumes:
      - frappe-sites:/home/frappe/frappe-bench/sites
      # - ./init.sh:/workspace/init.sh  <-- Yeh line bhi hata do
    ports:
      - "8000:8000"
    networks:
      - internal_net
      - dokploy-network
    restart: unless-stopped

volumes:
  mariadb-data:
  frappe-sites:

networks:
  internal_net:
  dokploy-network:
    external: true
